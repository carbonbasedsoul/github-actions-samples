name: Blue/Green Deployment to GKE

on:
  push:
    branches: [main, blue-green]
  workflow_dispatch:

env:
  NAMESPACE: hello-gitops
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/hello-gitops

jobs:
  ci:
    name: CI - Test and Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./app
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint
        working-directory: ./app
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        working-directory: ./app
        run: pytest

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  cd:
    name: CD - Blue/Green Deploy
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} \
            --region ${{ secrets.GKE_REGION }}

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Determine deployment target
        id: target
        run: |
          ACTIVE=$(kubectl get svc hello-gitops -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "none")

          if [ "$ACTIVE" = "blue" ] || [ "$ACTIVE" = "none" ]; then
            NEW="green"
            OLD="blue"
          else
            NEW="blue"
            OLD="green"
          fi

          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "Deploying to: $NEW (current: $ACTIVE)"

      - name: Deploy new version (${{ steps.target.outputs.new }})
        run: |
          kubectl apply -f k8s-blue-green/deployment-${{ steps.target.outputs.new }}.yaml \
            -n ${{ env.NAMESPACE }}

          kubectl set image deployment/hello-gitops-${{ steps.target.outputs.new }} \
            hello-gitops=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hello-gitops-${{ steps.target.outputs.new }} \
            -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Switch traffic to ${{ steps.target.outputs.new }}
        run: |
          kubectl apply -f k8s-blue-green/service.yaml -n ${{ env.NAMESPACE }}
          kubectl patch service hello-gitops -n ${{ env.NAMESPACE }} \
            -p '{"spec":{"selector":{"version":"${{ steps.target.outputs.new }}"}}}'

      - name: Delete old deployment (${{ steps.target.outputs.old }})
        run: |
          kubectl delete deployment hello-gitops-${{ steps.target.outputs.old }} \
            -n ${{ env.NAMESPACE }} 2>/dev/null || echo "No old deployment to delete"

      - name: Get service endpoint
        run: |
          sleep 5
          kubectl get service hello-gitops -n ${{ env.NAMESPACE }}

      - name: Update manifest
        run: |
          sed -i '' "s|newTag:.*|newTag: ${{ github.sha }}|" k8s-blue-green/kustomization.yaml

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add k8s-blue-green/kustomization.yaml
          git diff --staged --quiet || git commit -m "Deploy ${{ github.sha }} to ${{ steps.target.outputs.new }}"
          git push
